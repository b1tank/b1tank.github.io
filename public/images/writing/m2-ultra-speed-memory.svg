<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Peak memory versus generation throughput for tested Qwen models</title><desc id="desc">Peak memory versus generation throughput for tested Qwen models</desc><rect width="100%" height="100%" rx="18" fill="#10141c"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dce5f2}.muted{fill:#8e9bad}.grid{stroke:#293140;stroke-width:1}.value{font-weight:700}</style><text x="48" y="48" font-size="24" font-weight="700">Speed, memory, and architecture</text><text x="48" y="75" font-size="14" class="muted">Selected best measured mode; upper-left is better</text><line x1="80" y1="400.0" x2="850" y2="400.0" class="grid"/><line x1="80" y1="350.8333333333333" x2="850" y2="350.8333333333333" class="grid"/><line x1="80" y1="301.6666666666667" x2="850" y2="301.6666666666667" class="grid"/><line x1="80" y1="252.5" x2="850" y2="252.5" class="grid"/><line x1="80" y1="203.33333333333334" x2="850" y2="203.33333333333334" class="grid"/><line x1="80" y1="154.16666666666666" x2="850" y2="154.16666666666666" class="grid"/><line x1="80" y1="105.0" x2="850" y2="105.0" class="grid"/><line x1="137.03703703703704" y1="105" x2="137.03703703703704" y2="400" class="grid"/><text x="137.03703703703704" y="425" text-anchor="middle" font-size="12" class="muted">20 GiB</text><line x1="279.6296296296296" y1="105" x2="279.6296296296296" y2="400" class="grid"/><text x="279.6296296296296" y="425" text-anchor="middle" font-size="12" class="muted">25 GiB</text><line x1="422.22222222222223" y1="105" x2="422.22222222222223" y2="400" class="grid"/><text x="422.22222222222223" y="425" text-anchor="middle" font-size="12" class="muted">30 GiB</text><line x1="564.8148148148148" y1="105" x2="564.8148148148148" y2="400" class="grid"/><text x="564.8148148148148" y="425" text-anchor="middle" font-size="12" class="muted">35 GiB</text><line x1="707.4