<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
  <title id="title">App notebook concept</title>
  <desc id="desc">A desktop workspace with a sidebar app shelf, a prompt input, and movable cards for a countdown, screenshot tool, chart, and lesson canvas.</desc>
  <rect width="1200" height="680" rx="28" fill="#e9e4d8"/>
  <rect x="32" y="32" width="1136" height="616" rx="18" fill="#f8f5ec" stroke="#b8b09f" stroke-width="3"/>
  <rect x="32" y="32" width="1136" height="58" rx="18" fill="#262722"/>
  <circle cx="70" cy="61" r="8" fill="#e46b5d"/>
  <circle cx="96" cy="61" r="8" fill="#d8a43b"/>
  <circle cx="122" cy="61" r="8" fill="#6da16a"/>
  <text x="600" y="69" text-anchor="middle" fill="#f8f5ec" font-family="system-ui, sans-serif" font-size="22" font-weight="650">My App Notebook</text>

  <rect x="32" y="90" width="235" height="558" fill="#efeadf"/>
  <text x="62" y="132" fill="#282923" font-family="system-ui, sans-serif" font-size="19" font-weight="700">APP SHELF</text>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#45463f">
    <rect x="54" y="155" width="190" height="54" rx="10" fill="#fffdf7" stroke="#c9c1b1"/>
    <text x="76" y="188">◷  Countdown</text>
    <rect x="54" y="221" width="190" height="54" rx="10" fill="#fffdf7" stroke="#c9c1b1"/>
    <text x="76" y="254">⌗  Screenshot</text>
    <rect x="54" y="287" width="190" height="54" rx="10" fill="#fffdf7" stroke="#c9c1b1"/>
    <text x="76" y="320">▥  Meal gallery</text>
    <rect x="54" y="353" width="190" height="54" rx="10" fill="#fffdf7" stroke="#c9c1b1"/>
    <text x="76" y="386">△  Math lesson</text>
  </g>
  <rect x="54" y="573" width="190" height="48" rx="24" fill="#2f61a8"/>
  <text x="149" y="604" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="18" font-weight="650">+ New app</text>

  <rect x="294" y="113" width="844" height="70" rx="14" fill="#fff" stroke="#b8b09f" stroke-width="2"/>
  <text x="325" y="142" fill="#77756d" font-family="system-ui, sans-serif" font-size="15" font-weight="650">PROMPT</text>
  <text x="325" y="166" fill="#363730" font-family="system-ui, sans-serif" font-size="20">Make a countdown for our family trip...</text>
  <rect x="1028" y="129" width="82" height="40" rx="20" fill="#2f61a8"/>
  <text x="1069" y="155" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="650">Build</text>

  <g font-family="system-ui, sans-serif">
    <rect x="294" y="211" width="370" height="186" rx="16" fill="#fff" stroke="#c7bead" stroke-width="2"/>
    <rect x="294" y="211" width="370" height="42" rx="16" fill="#dce8f7"/>
    <text x="316" y="239" fill="#263b59" font-size="17" font-weight="700">Family trip</text>
    <text x="479" y="325" text-anchor="middle" fill="#2458a6" font-size="52" font-weight="750">18 days</text>
    <text x="479" y="360" text-anchor="middle" fill="#65655e" font-size="16">until takeoff</text>

    <rect x="690" y="211" width="448" height="278" rx="16" fill="#fff" stroke="#c7bead" stroke-width="2"/>
    <rect x="690" y="211" width="448" height="42" rx="16" fill="#efe0ce"/>
    <text x="712" y="239" fill="#59422b" font-size="17" font-weight="700">Quick chart</text>
    <line x1="742" y1="437" x2="1083" y2="437" stroke="#a8a193" stroke-width="2"/>
    <line x1="742" y1="286" x2="742" y2="437" stroke="#a8a193" stroke-width="2"/>
    <rect x="782" y="365" width="48" height="72" rx="5" fill="#709bd2"/>
    <rect x="858" y="319" width="48" height="118" rx="5" fill="#d39b45"/>
    <rect x="934" y="286" width="48" height="151" rx="5" fill="#72a478"/>
    <rect x="1010" y="342" width="48" height="95" rx="5" fill="#a987bd"/>

    <rect x="294" y="423" width="370" height="197" rx="16" fill="#fff" stroke="#c7bead" stroke-width="2"/>
    <rect x="294" y="423" width="370" height="42" rx="16" fill="#e1eddf"/>
    <text x="316" y="451" fill="#304b2f" font-size="17" font-weight="700">Math canvas</text>
    <path d="M339 566 Q430 466 610 556" fill="none" stroke="#c84c46" stroke-width="5" stroke-linecap="round"/>
    <circle cx="476" cy="517" r="42" fill="none" stroke="#386eb7" stroke-width="4"/>
    <text x="608" y="597" text-anchor="end" fill="#77756d" font-size="15">editable objects</text>

    <rect x="690" y="515" width="448" height="105" rx="16" fill="#fff" stroke="#c7bead" stroke-width="2"/>
    <text x="716" y="550" fill="#363730" font-size="17" font-weight="700">Pinned idea</text>
    <text x="716" y="579" fill="#65655e" font-size="17">A note can stay text, or become an app.</text>
    <text x="716" y="603" fill="#2f61a8" font-size="15">Convert to app →</text>
  </g>
</svg>
