<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" role="img" aria-labelledby="title desc">
  <title id="title">Hoasis hybrid homelab topology</title>
  <desc id="desc">Remote and local clients reach private home services through WireGuard, AdGuard split DNS, and Caddy. Azure DNS, Key Vault, Container Registry, and Application Insights form a small cloud control plane, while public applications run separately in Azure Container Apps.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M1 1l16 8-16 8z" fill="#507db8"/></marker>
    <marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M1 1l16 8-16 8z" fill="#b47a25"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#24251f" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1400" height="920" rx="30" fill="#f8f5ec"/>
  <text x="700" y="66" text-anchor="middle" fill="#20201d" font-family="Georgia, serif" font-size="34" font-weight="700">Hoasis: a hybrid homelab</text>

  <g font-family="system-ui, sans-serif">
    <rect x="56" y="94" width="1288" height="218" rx="22" fill="#eef3fa" stroke="#9ab0cf" stroke-width="2"/>
    <text x="82" y="128" fill="#507db8" font-size="16" font-weight="750" letter-spacing="1.5">AZURE CONTROL PLANE AND PUBLIC APPS</text>

    <g filter="url(#shadow)">
      <rect x="82" y="158" width="180" height="110" rx="16" fill="#fff" stroke="#507db8" stroke-width="3"/>
      <text x="172" y="198" text-anchor="middle" fill="#20201d" font-size="20" font-weight="700">Azure DNS</text>
      <text x="172" y="226" text-anchor="middle" fill="#69675f" font-size="14">VPN endpoint</text>
      <text x="172" y="248" text-anchor="middle" fill="#69675f" font-size="14">TLS challenges</text>

      <rect x="292" y="158" width="180" height="110" rx="16" fill="#fff" stroke="#8c78ae" stroke-width="3"/>
      <text x="382" y="198" text-anchor="middle" fill="#20201d" font-size="20" font-weight="700">Key Vault</text>
      <text x="382" y="226" text-anchor="middle" fill="#69675f" font-size="14">scoped deployment</text>
      <text x="382" y="248" text-anchor="middle" fill="#69675f" font-size="14">credentials</text>

      <rect x="502" y="158" width="190" height="110" rx="16" fill="#fff" stroke="#d49a5a" stroke-width="3"/>
      <text x="597" y="198" text-anchor="middle" fill="#20201d" font-size="20" font-weight="700">Container Registry</text>
      <text x="597" y="226" text-anchor="middle" fill="#69675f" font-size="14">custom Caddy</text>
      <text x="597" y="248" text-anchor="middle" fill="#69675f" font-size="14">personal images</text>

      <rect x="722" y="158" width="210" height="110" rx="16" fill="#fff" stroke="#6fa47b" stroke-width="3"/>
      <text x="827" y="198" text-anchor="middle" fill="#20201d" font-size="20" font-weight="700">App Insights + Logs</text>
      <text x="827" y="226" text-anchor="middle" fill="#69675f" font-size="14">traces · health</text>
      <text x="827" y="248" text-anchor="middle" fill="#69675f" font-size="14">failure alerts</text>

      <rect x="962" y="158" width="346" height="110" rx="16" fill="#20201d" stroke="#20201d" stroke-width="3"/>
      <text x="1135" y="195" text-anchor="middle" fill="#f8f5ec" font-size="20" font-weight="700">Public Container Apps</text>
      <text x="1135" y="225" text-anchor="middle" fill="#aaa79d" font-size="14">Yummy Jars · OpenMathBoard · 乐之翁</text>
      <text x="1135" y="248" text-anchor="middle" fill="#aaa79d" font-size="14">managed compute, data, identity, and alerts</text>
    </g>

    <rect x="56" y="340" width="1288" height="508" rx="22" fill="#f3efe5" stroke="#c9c1b1" stroke-width="2"/>
    <text x="82" y="376" fill="#8a672f" font-size="16" font-weight="750" letter-spacing="1.5">PRIVATE HOME NETWORK</text>

    <g filter="url(#shadow)">
      <rect x="84" y="430" width="190" height="100" rx="16" fill="#fff" stroke="#8a9fbc" stroke-width="3"/>
      <text x="179" y="470" text-anchor="middle" fill="#20201d" font-size="20" font-weight="700">Remote client</text>
      <text x="179" y="499" text-anchor="middle" fill="#69675f" font-size="14">phone or laptop</text>

      <rect x="84" y="650" width="190" height="100" rx="16" fill="#fff" stroke="#8a9fbc" stroke-width="3"/>
      <text x="179" y="690" text-anchor="middle" fill="#20201d" font-size="20" font-weight="700">LAN client</text>
      <text x="179" y="719" text-anchor="middle" fill="#69675f" font-size="14">same HTTPS names</text>

      <rect x="320" y="418" width="220" height="124" rx="16" fill="#fff" stroke="#b47a25" stroke-width="3"/>
      <text x="430" y="450" text-anchor="middle" fill="#20201d" font-size="19" font-weight="700">Google Wifi mesh</text>
      <text x="430" y="476" text-anchor="middle" fill="#69675f" font-size="13">main router + 3 mesh points</text>
      <text x="430" y="499" text-anchor="middle" fill="#69675f" font-size="13">reserved leases · AdGuard DNS</text>
      <text x="430" y="522" text-anchor="middle" fill="#69675f" font-size="13">WireGuard port forward</text>

      <rect x="590" y="410" width="280" height="355" rx="22" fill="#fff" stroke="#507db8" stroke-width="3"/>
      <text x="730" y="448" text-anchor="middle" fill="#20201d" font-size="22" font-weight="750">ThinkCentre M700</text>
      <text x="730" y="471" text-anchor="middle" fill="#69675f" font-size="13">Ubuntu 22.04 · Pentium G4400T · 20 GB</text>
      <rect x="625" y="486" width="210" height="62" rx="13" fill="#eaf1fa" stroke="#507db8" stroke-width="2"/>
      <text x="730" y="524" text-anchor="middle" fill="#20201d" font-size="18" font-weight="700">WireGuard</text>
      <rect x="625" y="568" width="210" height="62" rx="13" fill="#eef6ec" stroke="#6fa47b" stroke-width="2"/>
      <text x="730" y="606" text-anchor="middle" fill="#20201d" font-size="18" font-weight="700">AdGuard split DNS</text>
      <rect x="625" y="650" width="210" height="62" rx="13" fill="#fbf1e4" stroke="#d49a5a" stroke-width="2"/>
      <text x="730" y="688" text-anchor="middle" fill="#20201d" font-size="18" font-weight="700">Caddy HTTPS router</text>
      <text x="730" y="742" text-anchor="middle" fill="#69675f" font-size="14">plus small network-adjacent services</text>

      <rect x="930" y="410" width="360" height="220" rx="22" fill="#fff" stroke="#8c78ae" stroke-width="3"/>
      <text x="1110" y="452" text-anchor="middle" fill="#20201d" font-size="23" font-weight="750">Synology DS1520+</text>
      <text x="1110" y="491" text-anchor="middle" fill="#69675f" font-size="14">Celeron J4125 · 20 GB · Portainer</text>
      <text x="1110" y="522" text-anchor="middle" fill="#20201d" font-size="17">Nextcloud · Matrix · persistent data</text>
      <text x="1110" y="552" text-anchor="middle" fill="#20201d" font-size="17">family apps · static app shelf</text>
      <text x="1110" y="582" text-anchor="middle" fill="#20201d" font-size="17">Hoasis Butler</text>
      <text x="1110" y="610" text-anchor="middle" fill="#69675f" font-size="14">containers placed close to durable data</text>

      <rect x="930" y="670" width="360" height="108" rx="20" fill="#fff" stroke="#c97670" stroke-width="3"/>
      <text x="1110" y="705" text-anchor="middle" fill="#20201d" font-size="20" font-weight="750">HP Pavilion Desktop 510</text>
      <text x="1110" y="733" text-anchor="middle" fill="#69675f" font-size="14">Windows 10 · Hyper-V · Home Assistant OS</text>
      <text x="1110" y="756" text-anchor="middle" fill="#69675f" font-size="13">scheduled backups to the NAS</text>
    </g>
  </g>

  <g fill="none" stroke="#507db8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M274 480h46"/>
    <path d="M540 480h50"/>
    <path d="M274 700h316"/>
    <path d="M870 682c36 0 38-158 60-158"/>
    <path d="M870 682h35c18 0 20 42 25 42"/>
  </g>
  <g fill="none" stroke="#b47a25" stroke-width="4" stroke-dasharray="9 9" stroke-linecap="round" marker-end="url(#arrowGold)">
    <path d="M172 268v100c0 35 7 45 7 62"/>
    <path d="M382 268v66c0 52 215 31 215 76"/>
    <path d="M597 268v55c0 45 513 20 513 87"/>
    <path d="M827 268v58c0 45 283 31 283 84"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    <rect x="320" y="391" width="128" height="28" rx="14" fill="#20201d"/><text x="384" y="410" text-anchor="middle" fill="#f8f5ec">VPN ENTRY</text>
    <text x="340" y="684" fill="#507db8">private DNS + HTTPS</text>
  </g>
</svg>
