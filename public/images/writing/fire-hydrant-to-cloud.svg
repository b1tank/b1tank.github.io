<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">From fire hydrant to cloud infrastructure</title>
  <desc id="desc">A fire hydrant, pipes, and water system on the left connect through analogy to a cloud service, network, and shared infrastructure on the right.</desc>
