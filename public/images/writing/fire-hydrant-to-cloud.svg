  <path d="M600 80v540" stroke="#d4cec0" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="300" y="70" text-anchor="middle" fill="#69675f" font-family="system-ui, sans-serif" font-size="22" font-weight="700">PHYSICAL WORLD</text>
  <text x="900" y="70" text-anchor="middle" fill="#69675f" font-family="system-ui, sans-serif" font-size="22" font-weight="700">DIGITAL WORLD</text>

  <g transform="translate(200 128)">
