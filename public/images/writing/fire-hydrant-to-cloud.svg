    <text x="151" y="513" text-anchor="middle" fill="#69675f" font-family="system-ui, sans-serif" font-size="18">pipes · pressure · shared supply</text>
  </g>

  <g transform="translate(750 136)">
    <path d="M68 208c-38 0-68-28-68-63 0-32 25-59 58-63 13-48 57-82 109-82 57 0 104 40 113 93 40 2 72 33 72 71 0 40-35 72-78 72H68z" fill="#dce8f7" stroke="#2458a6" stroke-width="5"/>
